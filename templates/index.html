<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔐 Password Generator</h1>

        <p class="subtitle">
            Generate ultra secure passwords instantly
        </p>

        <div class="password-box">

            <input
                    type="text"
                    id="password"
                    readonly
                    placeholder="Your secure password"
            >

            <button onclick="copyPassword()" class="copy-btn">
                Copy
            </button>

            <button onclick="clearPassword()" class="clear-btn">
                Clear
            </button>

        </div>

        <div class="settings">

            <div class="length-header">

                <label>Password Length</label>

                <span id="lengthValue">16</span>

            </div>

            <input
                    type="range"
                    min="8"
                    max="40"
                    value="16"
                    id="lengthSlider"
            >

        </div>

        <div class="options">

            <label>
                <input type="checkbox" id="uppercase" checked>
                Uppercase Letters
            </label>

            <label>
                <input type="checkbox" id="lowercase" checked>
                Lowercase Letters
            </label>

            <label>
                <input type="checkbox" id="numbers" checked>
                Numbers
            </label>

            <label>
                <input type="checkbox" id="symbols" checked>
                Special Characters
            </label>

        </div>

        <button class="generate-btn" onclick="generatePassword()">
            Generate Strong Password
        </button>

        <div id="strength">
            Very Strong
        </div>

        <div class="strength-meter">

            <div
                    class="strength-fill"
                    id="strength-fill"
            ></div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
